<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0E">
  <title>Current Sales | Supplement World Newcastle</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E0E0E;color:#F5F2EC;font-family:Arial,sans-serif;padding:24px;text-align:center}
    main{width:min(100%,430px);padding:34px 26px;border:1px solid #332F2B;border-radius:22px;background:#171717}
    img{width:150px;max-height:80px;object-fit:contain}
    .eyebrow{margin-top:24px;color:#D83B31;font-size:11px;font-weight:800;letter-spacing:2.5px}
    h1{font-family:Georgia,serif;font-size:42px;line-height:1;margin:14px 0 12px}
    p{color:#B9B1A8;font-size:15px;line-height:1.55;margin:0 auto 22px}
    a{display:flex;align-items:center;justify-content:center;width:100%;padding:15px 18px;border-radius:12px;background:#D83B31;color:white;text-decoration:none;font-weight:800}
    .small{font-size:11px;margin-top:16px;color:#8F8880}
  </style>
</head>
<body>
  <main>
    <img src="../img/sw.png" alt="Supplement World Newcastle">
    <div class="eyebrow">CURRENT SALES</div>
    <h1>Opening today’s offers</h1>
    <p>You’re being taken to the latest Supplement World Canada savings</p>
    <a id="open" href="https://supplementworldcanada.com/pages/deals">View current sales</a>
    <div class="small">This link updates without changing the QR on the poster</div>
  </main>
  <script>
    (() => {
      const DEAL_URL = "https://supplementworldcanada.com/pages/deals";
      const PARTNERS = new Set(["lafitnessnorth", "gymvmtkensington", "planetfitnesswhiteoaks"]);
      const params = new URLSearchParams(location.search);
      const source = (params.get("src") || "").toLowerCase();
      const qrVisit = params.get("qr") === "1";
      const qa = params.get("qa") === "1";
      const qaScan = params.get("qa_scan") === "1";
      const qaNonce = (params.get("qa_nonce") || "").replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 40);
      const scanSource = (qaScan ? "qa_sale_" : "sale_") + source;
      const scanKey = "sw-sales-qr-scan:" + scanSource + (qaScan && qaNonce ? ":" + qaNonce : "");
      const scanDay = new Date().toISOString().slice(0, 10);
      const SB = "https://eajxkvtlcimyroblyvhh.supabase.co";
      const KEY = "sb_publishable_dBEq3CFbH_JvIcIvqTelMA_03RrQwUK";
      document.getElementById("open").href = DEAL_URL;

      if (PARTNERS.has(source) && qrVisit && localStorage.getItem(scanKey) !== scanDay) {
        localStorage.setItem(scanKey, scanDay);
        fetch(SB + "/rest/v1/vault_scan_log", {
          method: "POST",
          keepalive: true,
          headers: {apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json", Prefer: "return=minimal"},
          body: JSON.stringify({source: scanSource})
        }).catch(() => localStorage.removeItem(scanKey));
      }

      if (!qa && !qaScan) setTimeout(() => location.replace(DEAL_URL), 700);
    })();
  </script>
</body>
</html>
